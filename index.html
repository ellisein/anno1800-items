<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Anno 1800 아이템 검색기</title>
    <link rel="stylesheet" href="style.css?v=20260725">
</head>
<body>
    <header>
        <h1>Anno 1800 아이템 검색기</h1>
    </header>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="검색" autocomplete="off" spellcheck="false">
    </div>
    
    <main>
        <div id="itemGrid" class="item-grid">
        </div>
    </main>

    <button id="sidebarToggle" class="sidebar-toggle"></button>

    <aside id="loadoutSidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>내 로드아웃</h2>
            <div class="sidebar-actions">
                <button id="addLoadoutBtn" class="add-loadout-full-btn">
                    <span class="plus-icon">+</span> 새 로드아웃 만들기
                </button>
            </div>
        </div>
        <div class="sidebar-content" id="loadoutContent">
        </div>
    </aside>

    <div id="itemTooltip" class="item-tooltip" style="display: none;"></div>

    <div id="customConfirmModal" class="custom-modal">
        <div class="modal-content">
            <p id="confirmMessage">정말 삭제하시겠습니까?</p>
            <div class="modal-actions">
                <button id="cancelBtn" class="btn-cancel">취소</button>
                <button id="confirmBtn" class="btn-confirm">삭제</button>
            </div>
        </div>
    </div>

    <script src="script.js?v=20260725"></script>
</body>
</html>
